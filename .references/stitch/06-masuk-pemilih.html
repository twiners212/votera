<!DOCTYPE html>

<html lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Masuk untuk Memilih - PILKETOS 2026</title>
<!-- Google Fonts: Plus Jakarta Sans -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
          },
          colors: {
            brand: {
              DEFAULT: '#D6362C',
              dark: '#A8201A',
              light: '#F87171',
              accent: '#FDE047',
            }
          }
        }
      }
    }
  </script>
<!-- Custom CSS for decorative visuals & tweaks -->
<style data-purpose="custom-styling">
    .ballot-box-graphic {
      opacity: 0.14;
      mix-blend-mode: overlay;
    }
    input:focus {
      outline: none;
      box-shadow: 0 0 0 3px rgba(214, 54, 44, 0.15);
    }
  </style>
</head>
<body class="bg-[#ECEBE9] font-sans antialiased text-slate-800 min-h-screen flex items-center justify-center p-0 sm:py-6">
<!-- BEGIN: MobileDeviceContainer -->
<!-- Constrained container replicating iOS mobile canvas -->
<main class="w-full max-w-[430px] min-h-screen sm:min-h-[880px] bg-[#FAF9F7] sm:rounded-[36px] overflow-hidden shadow-2xl relative flex flex-col justify-between" data-purpose="mobile-viewport">
<!-- BEGIN: HeroHeader -->
<!-- Red gradient banner with school branding & election badge watermark -->
<header class="relative bg-gradient-to-br from-[#9E1B15] via-[#C52B22] to-[#DB382F] pt-8 pb-14 px-6 text-white overflow-hidden" data-purpose="election-header">
<!-- Decorative ballot box and patriotic voting motifs -->
<div aria-hidden="true" class="absolute -right-6 top-6 w-56 h-56 pointer-events-none ballot-box-graphic select-none">
<svg class="w-full h-full text-white fill-current" fill="none" viewbox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
<!-- Ballot Box & Slotted Ballot SVG Silhouette -->
<path d="M40 90 L160 90 L145 180 L55 180 Z" opacity="0.4"></path>
<path d="M30 85 L170 85 L160 100 L40 100 Z" opacity="0.6"></path>
<path d="M75 40 L125 40 L125 80 L75 80 Z" opacity="0.8"></path>
<!-- Garuda / National Emblem Crest inside Ballot box -->
<circle cx="100" cy="130" fill="none" opacity="0.7" r="16" stroke="white" stroke-width="3"></circle>
<path d="M93 130 L100 123 L107 130 L100 137 Z" fill="white" opacity="0.8"></path>
</svg>
</div>
<!-- School Logo and Title Header -->
<div class="relative z-10 flex items-center gap-3 mb-6" data-purpose="school-identity">
<!-- Logo Badge -->
<div class="w-11 h-11 rounded-full bg-emerald-100/90 border-2 border-amber-300 p-0.5 shadow flex items-center justify-center shrink-0">
<div class="w-full h-full rounded-full bg-emerald-700 flex flex-col items-center justify-center text-[7px] text-center font-bold text-amber-200 leading-tight">
<span>SMA 1</span>
<span class="text-white text-[6px]">OSIS</span>
</div>
</div>
<!-- School & Event Name -->
<div>
<div class="text-base font-extrabold tracking-wide uppercase flex items-center gap-1.5 leading-none">
<span>PILKETOS</span>
<span class="text-[#FDE047]">2026</span>
</div>
<div class="text-xs text-rose-100 font-medium tracking-normal mt-1 opacity-90">
            SMA Bojong Gede
          </div>
</div>
</div>
<!-- Display Heading -->
<div class="relative z-10 mt-3 mb-4" data-purpose="title-group">
<h1 class="text-2xl sm:text-[26px] font-extrabold leading-tight text-white tracking-tight">
          Pemilihan Ketua<br/>
<span class="text-[#FDE047] font-extrabold tracking-normal">OSIS 2026</span>
</h1>
</div>
</header>
<!-- END: HeroHeader -->
<!-- BEGIN: LoginFormSection -->
<!-- Elevated white rounded card for authentication -->
<section class="flex-1 bg-white rounded-t-[28px] -mt-7 relative z-20 px-6 pt-6 pb-8 shadow-[0_-8px_30px_rgba(0,0,0,0.08)] flex flex-col justify-between" data-purpose="voter-login-card">
<div>
<!-- Status Indicator Pill -->
<div class="inline-flex items-center gap-2 bg-[#ECFDF5] border border-emerald-100 text-[#047857] text-[11px] font-semibold px-3 py-1 rounded-full mb-4.5" data-purpose="poll-status">
<span class="w-2 h-2 rounded-full bg-[#10B981] animate-pulse"></span>
<span>Pemungutan suara dibuka</span>
</div>
<!-- Section Intro -->
<div class="mb-5">
<h2 class="text-xl font-extrabold text-slate-900 tracking-tight">
            Masuk untuk memilih
          </h2>
<p class="text-[13px] text-slate-500 mt-1 leading-snug">
            Gunakan NIS dan token yang dibagikan panitia kepada kamu.
          </p>
</div>
<!-- Authentication Form -->
<form action="#" class="space-y-4" data-purpose="credential-form" method="POST" onsubmit="event.preventDefault();">
<!-- NIS Field -->
<div>
<label class="block text-[11px] font-bold uppercase tracking-wider text-slate-700 mb-1.5" for="nis">
              NIS
            </label>
<div class="relative">
<!-- User Icon -->
<span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
<svg class="h-4.5 w-4.5" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</span>
<input class="w-full bg-white border border-slate-200 rounded-xl py-3 pl-10 pr-4 text-sm placeholder:text-slate-400 text-slate-800 transition duration-150 ease-in-out focus:border-[#D6362C] focus:ring-0" id="nis" inputmode="numeric" name="nis" placeholder="Masukkan NIS kamu" required="" type="text"/>
</div>
</div>
<!-- Token Field -->
<div>
<label class="block text-[11px] font-bold uppercase tracking-wider text-slate-700 mb-1.5" for="token">
              Token
            </label>
<div class="relative">
<!-- Lock Icon -->
<span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
<svg class="h-4.5 w-4.5" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</span>
<input class="w-full bg-white border border-slate-200 rounded-xl py-3 pl-10 pr-10 text-sm uppercase placeholder:normal-case placeholder:text-slate-400 text-slate-800 transition duration-150 ease-in-out focus:border-[#D6362C] focus:ring-0" id="token" name="token" placeholder="Contoh: ABCD2345" required="" type="password"/>
<!-- Password Toggle Visibility Button -->
<button aria-label="Tampilkan atau sembunyikan token" class="absolute inset-y-0 right-0 pr-3.5 flex items-center text-slate-400 hover:text-slate-600 focus:outline-none" id="toggleTokenVisibility" type="button">
<svg class="h-4.5 w-4.5" fill="none" stroke="currentColor" stroke-width="1.8" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
</div>
<!-- Submit Action Button -->
<div class="pt-2">
<button class="w-full bg-[#C8322B] hover:bg-[#B0251E] active:scale-[0.99] text-white font-bold py-3.5 px-4 rounded-xl shadow-lg shadow-red-600/25 transition duration-150 ease-in-out text-center text-sm tracking-wide" type="submit">
              Masuk
            </button>
</div>
</form>
</div>
<!-- BEGIN: FooterNavigation -->
<!-- Secondary actions and contact guidance -->
<footer class="mt-8 pt-4 border-t border-slate-100 text-center" data-purpose="navigation-footer">
<a class="inline-flex items-center gap-1.5 text-xs font-semibold text-slate-700 hover:text-[#C8322B] transition-colors" href="#">
<span aria-hidden="true">â†</span> Kembali ke beranda
        </a>
<p class="text-[11px] text-slate-400 mt-2">
          Lupa token? <a class="underline hover:text-slate-600 transition-colors" href="#">Hubungi panitia</a>.
        </p>
</footer>
<!-- END: FooterNavigation -->
</section>
<!-- END: LoginFormSection -->
</main>
<!-- END: MobileDeviceContainer -->
<!-- Interactive script for password/token visibility toggle -->
<script data-purpose="toggle-token-script">
    document.addEventListener('DOMContentLoaded', () => {
      const toggleBtn = document.getElementById('toggleTokenVisibility');
      const tokenInput = document.getElementById('token');

      if (toggleBtn && tokenInput) {
        toggleBtn.addEventListener('click', () => {
          const isPassword = tokenInput.getAttribute('type') === 'password';
          tokenInput.setAttribute('type', isPassword ? 'text' : 'password');
        });
      }
    });
  </script>
</body></html>
